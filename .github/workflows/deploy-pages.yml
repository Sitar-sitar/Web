name: Build and deploy both sites

on:
  push:
    branches:
      - hoyoversebuilder
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-two-sites
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HoYoverse site
        uses: actions/checkout@v6
        with:
          ref: hoyoversebuilder
          path: hoyoverse

      - name: Checkout RubberDB site
        uses: actions/checkout@v6
        with:
          ref: RubberDB
          path: rubber

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install HoYoverse dependencies
        working-directory: hoyoverse
        run: pnpm install --frozen-lockfile

      - name: Validate HoYoverse API build
        working-directory: hoyoverse
        run: pnpm build:api

      - name: Verify Railway API
        env:
          API_BASE_URL: https://hoyoverse-builder-api-production.up.railway.app
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          health="$(mktemp)"
          trpc="$(mktemp)"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Origin: https://sitar-sitar.github.io" \
            -D "$headers" \
            "$API_BASE_URL/api/health" \
            -o "$health"
          grep -q '"ok":true' "$health"
          grep -qi '^access-control-allow-origin: https://sitar-sitar.github.io' "$headers"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Origin: https://sitar-sitar.github.io" \
            "$API_BASE_URL/api/trpc/build.guideHistory" \
            -o "$trpc"
          grep -q '"result"' "$trpc"

      - name: Build HoYoverse site
        working-directory: hoyoverse
        env:
          VITE_API_BASE_URL: ${{ vars.HOYOVERSE_API_BASE_URL || 'https://hoyoverse-builder-api-production.up.railway.app' }}
        run: pnpm exec vite build --config vite.pages.config.ts --base /Web/hoyoverse/

      - name: Install RubberDB dependencies
        working-directory: rubber
        run: pnpm install --frozen-lockfile

      - name: Build RubberDB site
        working-directory: rubber
        run: pnpm exec vite build --base /Web/rubber/

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/hoyoverse site/rubber
          cp -a hoyoverse/dist/public/. site/hoyoverse/
          cp -a rubber/dist/public/. site/rubber/

          # GitHub Pages does not provide SPA history fallback for nested paths.
          # Publish index.html at every known client-side route so direct links and
          # OAuth redirects such as /admin work without a Pages 404.
          for route in characters updates feedback admin admin/feedback; do
            mkdir -p "site/hoyoverse/$route"
            cp site/hoyoverse/index.html "site/hoyoverse/$route/index.html"
          done

          cp site/hoyoverse/index.html site/hoyoverse/404.html
          cp site/rubber/index.html site/rubber/404.html
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width,initial-scale=1" />
              <title>Sitar-sitar Web</title>
              <style>
                body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:64px auto;padding:0 20px;line-height:1.7}
                a{display:block;margin:16px 0;padding:18px;border:1px solid #ccc;border-radius:12px;text-decoration:none;color:inherit}
                strong{display:block;font-size:1.15rem}
              </style>
            </head>
            <body>
              <h1>Sitar-sitar Web</h1>
              <a href="./hoyoverse/"><strong>HoYoverse Builder</strong>崩壊：スターレイル・原神・ゼンレスゾーンゼロ ビルド支援</a>
              <a href="./rubber/"><strong>RubberDB</strong>卓球ラバー図鑑</a>
            </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
